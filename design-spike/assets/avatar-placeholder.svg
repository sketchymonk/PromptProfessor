<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Placeholder avatar for Trump tutor persona — stylized executive silhouette, not a likeness">
  <!-- Background fill -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </radialGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a64c"/>
      <stop offset="50%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="tie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b83030"/>
      <stop offset="100%" stop-color="#7a2020"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="100%" stop-color="#b8923f"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>

  <!-- Neck / collar -->
  <path d="M 75 155 Q 100 165 125 155 L 130 200 L 70 200 Z" fill="#f4ede0" opacity="0.08"/>

  <!-- Suit shoulders/jacket -->
  <path d="M 40 200 L 50 160 Q 70 145 100 145 Q 130 145 150 160 L 160 200 Z" fill="url(#suit)"/>
  <!-- Suit lapels -->
  <path d="M 75 158 L 100 180 L 95 200 L 70 200 Z" fill="#171717"/>
  <path d="M 125 158 L 100 180 L 105 200 L 130 200 Z" fill="#171717"/>

  <!-- Tie -->
  <path d="M 97 155 L 103 155 L 108 175 L 100 200 L 92 175 Z" fill="url(#tie)"/>
  <!-- Tie knot -->
  <path d="M 94 155 L 106 155 L 108 165 L 92 165 Z" fill="#7a2020"/>

  <!-- Head silhouette -->
  <ellipse cx="100" cy="108" rx="38" ry="42" fill="#e8c9a8"/>

  <!-- Iconic hair (abstract sweeping wave — caricature cue, not portrait) -->
  <path d="M 62 85 Q 65 55 100 52 Q 135 54 140 82 Q 138 70 128 68 Q 120 60 105 66 Q 95 60 80 70 Q 68 74 62 85 Z" fill="url(#hair)"/>
  <path d="M 68 78 Q 90 66 128 72 Q 132 76 126 82 Q 108 74 75 84 Z" fill="#f0d275" opacity="0.6"/>

  <!-- Eyes (abstract — just two dots, cartoon style) -->
  <ellipse cx="86" cy="108" rx="2.5" ry="3" fill="#1a1612"/>
  <ellipse cx="114" cy="108" rx="2.5" ry="3" fill="#1a1612"/>

  <!-- Mouth (confident, subtle smile line) -->
  <path d="M 88 128 Q 100 134 112 128" stroke="#7a4a2a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Gold circular frame -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#goldFrame)" stroke-width="3"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.4"/>

  <!-- Placeholder marker (subtle corner tag) -->
  <g transform="translate(142, 22)">
    <rect x="0" y="0" width="50" height="14" rx="2" fill="#d4af37" opacity="0.9"/>
    <text x="25" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#0f0f0f" letter-spacing="0.5">PLACEHOLDER</text>
  </g>
</svg>
