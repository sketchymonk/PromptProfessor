<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Gold foil decorative texture used on verdict stamps and capstone reveals">
  <defs>
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8923f"/>
      <stop offset="25%" stop-color="#e5c158"/>
      <stop offset="50%" stop-color="#f0d275"/>
      <stop offset="75%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#c9a64c"/>
    </linearGradient>
    <linearGradient id="shimmer1" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shimmer2" cx="30%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shimmer3" cx="75%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffe8a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.95
                             0 0 0 0 0.85
                             0 0 0 0 0.45
                             0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Base gold -->
  <rect width="400" height="400" fill="url(#goldBase)"/>
  <!-- Streak shimmers -->
  <rect width="400" height="400" fill="url(#shimmer1)" transform="rotate(-12 200 200)"/>
  <rect width="400" height="400" fill="url(#shimmer2)"/>
  <rect width="400" height="400" fill="url(#shimmer3)"/>
  <!-- Fine noise grain -->
  <rect width="400" height="400" filter="url(#noise)" opacity="0.5"/>

  <!-- Art-deco bordering lines -->
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#8a6820" stroke-width="1" opacity="0.6"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#8a6820" stroke-width="0.5" opacity="0.4"/>
</svg>
